<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>竖纹触发测试</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 10;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #d8dee9;
        font-size: 13px;
        line-height: 1.8;
        pointer-events: none;
      }
      #hud b {
        color: #6fd3ff;
        font-family: Consolas, monospace;
      }
      #hud .t {
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 4px;
      }
      #hud .warn {
        color: #ffcc66;
      }
      #hud.hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="t">竖纹触发测试</div>
      当前条纹周期：<b id="p">2</b> 物理像素 ｜ 状态：<b id="m">静态</b>
      <br />
      <span class="warn">按 F11 全屏</span>　
      <b>1</b> 1px　<b>2</b> 2px　<b>3</b> 3px　<b>4</b> 4px　<b>5</b> 8px
      <br />
      <b>空格</b> 静态/滚动　<b>C</b> 换配色　<b>H</b> 隐藏此说明
    </div>

    <script>
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d");
      const pEl = document.getElementById("p");
      const mEl = document.getElementById("m");
      const hud = document.getElementById("hud");

      const PERIODS = { 1: 1, 2: 2, 3: 3, 4: 4, 5: 8 };
      const PALETTES = [
        ["#ffffff", "#000000"], // 黑白
        ["#ffffff", "#c8102e"], // 白红
        ["#00ff6a", "#000000"], // 绿黑
      ];

      let period = 2;
      let palette = 0;
      let scroll = false;
      let offset = 0;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        cv.width = Math.round(window.innerWidth * dpr);
        cv.height = Math.round(window.innerHeight * dpr);
        draw();
      }

      function draw() {
        const w = cv.width;
        const h = cv.height;
        const [a, b] = PALETTES[palette];
        for (let x = 0; x < w; x++) {
          const on = Math.floor((x + offset) / period) % 2 === 0;
          ctx.fillStyle = on ? a : b;
          ctx.fillRect(x, 0, 1, h);
        }
        pEl.textContent = period;
        mEl.textContent = scroll ? "滚动中" : "静态";
      }

      let last = performance.now();
      function loop(now) {
        const dt = now - last;
        last = now;
        if (scroll) {
          offset = (offset + dt * 0.12) % 1000000;
          draw();
        }
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (PERIODS[k]) {
          period = PERIODS[k];
          draw();
        } else if (e.code === "Space") {
          e.preventDefault();
          scroll = !scroll;
          draw();
        } else if (k === "c") {
          palette = (palette + 1) % PALETTES.length;
          draw();
        } else if (k === "h") {
          hud.classList.toggle("hide");
        }
      });
      cv.addEventListener("click", () => {
        scroll = !scroll;
        draw();
      });

      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
