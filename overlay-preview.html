<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d");

      // 模拟"目标游戏窗口客户区"里的骨架点（已投影到屏幕坐标）
      const BONE = [
        [0, 660, 250],
        [1, 660, 300],
        [2, 598, 316],
        [3, 574, 400],
        [4, 560, 482],
        [5, 722, 316],
        [6, 746, 400],
        [7, 760, 482],
        [8, 660, 382],
        [9, 660, 462],
        [10, 624, 482],
        [11, 610, 570],
        [12, 600, 662],
        [13, 696, 482],
        [14, 710, 570],
        [15, 720, 662],
      ];
      const CONN = [
        [0, 1], [1, 8], [1, 2], [2, 3], [3, 4],
        [1, 5], [5, 6], [6, 7], [8, 9],
        [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15],
      ];
      const FONT_COLOR = "#FFD54A";
      const LINE_COLOR = "#35E0FF";

      function draw() {
        const W = (cv.width = innerWidth);
        const H = (cv.height = innerHeight);

        // ---------- 模拟游戏画面 ----------
        const g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, "#16202e");
        g.addColorStop(0.5, "#22301f");
        g.addColorStop(1, "#2e2419");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#26374a";
        ctx.fillRect(0, H * 0.72, W, H * 0.28);
        ctx.fillStyle = "#37503a";
        ctx.beginPath();
        ctx.moveTo(0, H * 0.7);
        ctx.lineTo(W * 0.3, H * 0.45);
        ctx.lineTo(W * 0.55, H * 0.72);
        ctx.closePath();
        ctx.fill();

        // ---------- 象限分区参照 ----------
        ctx.save();
        ctx.strokeStyle = "rgba(53,224,255,0.72)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(Math.round(W / 2) + 0.5, 0);
        ctx.lineTo(Math.round(W / 2) + 0.5, H);
        ctx.moveTo(0, Math.round(H / 2) + 0.5);
        ctx.lineTo(W, Math.round(H / 2) + 0.5);
        ctx.stroke();
        const qsize = Math.round(Math.min(W, H) * 0.17);
        ctx.font = `800 ${qsize}px "Segoe UI","Microsoft YaHei UI",sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(150,180,240,0.22)";
        [
          ["TL", W * 0.25, H * 0.25],
          ["TR", W * 0.75, H * 0.25],
          ["BL", W * 0.25, H * 0.75],
          ["BR", W * 0.75, H * 0.75],
        ].forEach(([t, x, y]) => ctx.fillText(t, x, y));
        ctx.restore();

        // ---------- 骨骼连线 ----------
        ctx.strokeStyle = LINE_COLOR;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.6;
        const map = new Map(BONE.map(([i, x, y]) => [i, { x, y }]));
        for (const [a, b] of CONN) {
          const pa = map.get(a);
          const pb = map.get(b);
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // ---------- 骨骼点 + 序号 ----------
        ctx.font = '600 13px "Consolas", monospace';
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        for (const [i, x, y] of BONE) {
          ctx.fillStyle = "rgba(5,12,24,0.85)";
          ctx.beginPath();
          ctx.arc(x, y, 4.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = LINE_COLOR;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(x, y, 3.2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = FONT_COLOR;
          ctx.fillText(String(i), x + 6, y - 6);
        }

        // ---------- 预览点（金色，方案预览） ----------
        const pv = { x: 452, y: 372 };
        ctx.strokeStyle = "#FFD54A";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(pv.x, pv.y, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(pv.x - 13, pv.y);
        ctx.lineTo(pv.x + 13, pv.y);
        ctx.moveTo(pv.x, pv.y - 13);
        ctx.lineTo(pv.x, pv.y + 13);
        ctx.stroke();

        // ---------- 实时点（绿色，鼠标投影；橙色 = 近边界） ----------
        const drawRt = (x, y, color, label) => {
          ctx.save();
          ctx.shadowColor = color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.strokeStyle = "rgba(255,255,255,0.9)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(x, y, 9, 0, Math.PI * 2);
          ctx.stroke();
          ctx.font = '600 11px "Consolas", monospace';
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          const tw = ctx.measureText(label).width;
          ctx.fillRect(x + 12, y - 20, tw + 8, 15);
          ctx.fillStyle = color;
          ctx.fillText(label, x + 16, y - 12);
        };
        drawRt(880, 430, "#35E07A", "realtime");
        drawRt(980, 300, "#FFB545", "borderline");

        // ---------- 中心准星 ----------
        const cx = W / 2;
        const cy = H / 2;
        ctx.strokeStyle = "rgba(235,244,255,0.7)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(cx - 26, cy);
        ctx.lineTo(cx - 6, cy);
        ctx.moveTo(cx + 6, cy);
        ctx.lineTo(cx + 26, cy);
        ctx.moveTo(cx, cy - 26);
        ctx.lineTo(cx, cy - 6);
        ctx.moveTo(cx, cy + 6);
        ctx.lineTo(cx, cy + 26);
        ctx.stroke();
        ctx.strokeStyle = "rgba(53,224,255,0.9)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
        ctx.stroke();

        // ---------- 图例 ----------
        const legend = [
          ["#35E07A", "实时点（鼠标投影）"],
          ["#FFB545", "实时点 · 近边界"],
          ["#FFD54A", "预览点（方案 preview）"],
          ["#35E0FF", "骨骼连线 + 十字分区线"],
          ["#FFD54A", "骨骼序号（0 ~ N）"],
        ];
        ctx.font = '500 12px "Microsoft YaHei UI", sans-serif';
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        let ly = 28;
        for (const [c, t] of legend) {
          ctx.fillStyle = "rgba(6,10,20,0.72)";
          ctx.fillRect(16, ly - 11, 240, 22);
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(30, ly, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#dbe4f5";
          ctx.fillText(t, 44, ly);
          ly += 26;
        }
      }
      addEventListener("resize", draw);
      draw();
    </script>
  </body>
</html>
